<head>

    <title>千秋聚合资源频道 - 你的数字资源分享空间</title>
    <!-- 替换为公共CDN的字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #3B82F6;
            --accent: #F59E0B;
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased; /* 移动端字体抗锯齿 */
        }

        /* 头部导航 - 移动端优化 */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95); /* 增强透明度 */
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 5%; /* 使用百分比适配移动端 */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem; /* 移动端字体微调 */
            font-weight: 700;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--secondary);
        }

        /* Hero 区域 - 移动端优化 */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 5% 2rem; /* 减少移动端上下内边距 */
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem); /* 响应式字体 */
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.3; /* 优化行高 */
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1rem, 3vw, 1.1rem); /* 响应式字体 */
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem; /* 减少移动端下边距 */
            padding: 0 1rem; /* 移动端左右内边距 */
            line-height: 1.7;
        }

        /* 主要CTA按钮 - 移动端优化（改回资源表格） */
        .primary-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--secondary);
            color: white;
            padding: 1rem clamp(1.5rem, 8vw, 2.5rem); /* 响应式内边距 */
            border-radius: 12px;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            cursor: pointer;
            border: none;
            min-height: 50px; /* 保证移动端点击区域 */
            min-width: 80%; /* 移动端按钮更宽 */
            justify-content: center;
        }

        .primary-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        /* 主内容区 - 移动端优化 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 5%; /* 减少移动端内边距 */
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem; /* 减少间距 */
        }

        /* 最新文章区域 - 移动端优化 */
        .articles-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem; /* 减少内边距 */
            box-shadow: 0 2px 8px var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: clamp(1.2rem, 4vw, 1.5rem); /* 响应式字体 */
            font-weight: 700;
            color: var(--primary);
        }

        .update-badge {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: clamp(0.75rem, 2vw, 0.85rem); /* 响应式字体 */
            font-weight: 600;
            animation: pulse 2s infinite;
            white-space: nowrap; /* 防止文字换行 */
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem; /* 减少间距 */
        }

        .article-item {
            padding: 1rem; /* 减少内边距 */
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            touch-action: manipulation; /* 优化移动端触摸 */
        }

        .article-item:hover {
            transform: translateX(4px);
            border-color: var(--secondary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        /* 公告样式 */
        .article-item.announcement {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border: 2px solid var(--accent);
            border-left: 4px solid var(--accent);
        }

        .article-item.announcement .article-title::before {
            content: "📢 ";
        }

        .announcement-badge {
            position: absolute;
            top: -8px;
            right: 10px;
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .article-title {
            font-size: clamp(1rem, 3vw, 1.1rem); /* 响应式字体 */
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            font-size: clamp(0.75rem, 2vw, 0.85rem); /* 响应式字体 */
            color: var(--text-muted);
        }

        .article-date {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* 侧边栏 - 移动端优化 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.2rem; /* 减少间距 */
        }

        .sidebar-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.2rem; /* 减少内边距 */
            box-shadow: 0 2px 8px var(--shadow);
        }

        .sidebar-card h3 {
            font-size: clamp(1rem, 3vw, 1.2rem); /* 响应式字体 */
            font-weight: 700;
            margin-bottom: 0.8rem; /* 减少间距 */
            color: var(--primary);
        }

        /* 社交媒体卡片 - 移动端优化（更新抖音链接） */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem; /* 减少间距 */
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 0.8rem; /* 减少间距 */
            padding: 0.8rem; /* 减少内边距 */
            background: var(--bg);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            touch-action: manipulation; /* 优化移动端触摸 */
            min-height: 60px; /* 保证移动端点击区域 */
        }

        .social-link:hover {
            transform: translateX(4px);
            border-color: var(--secondary);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .social-icon {
            width: 36px; /* 略缩小图标 */
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            flex-shrink: 0; /* 防止图标压缩 */
        }

        .wechat { background: linear-gradient(135deg, #07C160, #06AE56); }
        .douyin { background: linear-gradient(135deg, #000000, #333333); }
        .bilibili { background: linear-gradient(135deg, #FB7299, #FF8EB3); }
        .qq { background: linear-gradient(135deg, #12B7F5, #0099FF); }

        /* 快速访问 - 移动端优化 */
        .quick-access {
            display: flex;
            flex-direction: column;
            gap: 0.6rem; /* 减少间距 */
        }

        .access-btn {
            padding: 0.8rem; /* 减少内边距 */
            background: linear-gradient(135deg, var(--secondary), #2563EB);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            touch-action: manipulation; /* 优化移动端触摸 */
            min-height: 50px; /* 保证移动端点击区域 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 页脚 - 移动端优化 */
        .footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem 5%; /* 调整内边距 */
            margin-top: 2rem; /* 减少上边距 */
        }

        .footer p {
            font-size: clamp(0.8rem, 2vw, 1rem);
            line-height: 1.5;
        }

        /* 二维码弹窗 - 移动端深度优化 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* 加深遮罩 */
            animation: fadeIn 0.3s ease;
            padding: 1rem; /* 移动端内边距 */
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            padding: clamp(1.5rem, 8vw, 2.5rem);
            border-radius: 20px;
            text-align: center;
            max-width: 90%; /* 移动端占90%宽度 */
            width: 400px; /* 最大宽度 */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px); 
            }
            to { 
                opacity: 1;
                transform: translateY(0); 
            }
        }

        .modal-content h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: clamp(0.9rem, 3vw, 1rem);
            line-height: 1.6;
        }

        .qr-code-container {
            background: white;
            padding: 1rem; /* 减少内边距 */
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .qr-code-container img {
            width: clamp(180px, 60vw, 220px); /* 响应式二维码大小 */
            height: auto; /* 自适应高度 */
            display: block;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 1.6rem; /* 略缩小关闭按钮 */
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .close-modal:hover {
            background: var(--border);
            color: var(--text);
        }

        /* 响应式设计 - 深度优化 */
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr; /* 单列布局 */
                padding: 1rem 5%;
            }
            
            .hero h1 {
                font-size: clamp(1.6rem, 6vw, 2rem);
            }
            
            /* 移动端侧边栏卡片样式优化 */
            .sidebar-card {
                padding: 1.5rem;
            }
            
            /* 移动端文章项加大点击区域 */
            .article-item {
                min-height: 80px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        /* 小屏手机额外优化 */
        @media (max-width: 480px) {
            .hero {
                padding: 2rem 5% 1.5rem;
            }
            
            .primary-cta {
                padding: 0.9rem 1.5rem;
                min-height: 48px;
            }
            
            .articles-section {
                padding: 1rem;
            }
            
            .modal-content {
                padding: 1.5rem 1rem;
            }
            
            .qr-code-container {
                padding: 0.8rem;
            }
        }

        /* 占位符样式 */
        .placeholder {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 移动端触摸反馈优化 */
        a, button, .article-item, .social-link, .access-btn {
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }
    </style>
</head>

            {
                title: "【免费分享】48套-精选情人节PPT模板",
                url: "https://mp.weixin.qq.com/s/nUZUIbCCxXwq4gYfrA58CQ",
                date: "2026-01-27"
            }
        ];

        // 渲染文章列表
        function renderArticles() {
            const articleList = document.getElementById('articleList');
            articleList.innerHTML = '';
            
            articlesData.forEach((article, index) => {
                const articleItem = document.createElement('div');
                articleItem.className = 'article-item' + (article.isAnnouncement ? ' announcement' : '');
                articleItem.onclick = () => window.open(article.url, '_blank');
                
                // 添加动画延迟
                articleItem.style.opacity = '0';
                articleItem.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    articleItem.style.transition = 'all 0.5s ease';
                    articleItem.style.opacity = '1';
                    articleItem.style.transform = 'translateY(0)';
                }, index * 50);
                
                articleItem.innerHTML = `
                    ${article.isAnnouncement ? '<span class="announcement-badge">置顶公告</span>' : ''}
                    <div class="article-title">${article.title}</div>
                    <div class="article-meta">
                        <span class="article-date">📅 ${article.date}</span>
                    </div>
                `;
                
                articleList.appendChild(articleItem);
            });
        }

        // 二维码弹窗控制（保留公众号弹窗功能）
        function openQRModal() {
            document.getElementById('qrModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            // 移动端禁止缩放
            document.documentElement.style.overflow = 'hidden';
        }

        function closeQRModal(event) {
            if (!event || event.target === document.getElementById('qrModal')) {
                document.getElementById('qrModal').classList.remove('active');
                document.body.style.overflow = 'auto';
                document.documentElement.style.overflow = 'auto';
            }
        }

        // ESC键关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeQRModal();
            }
        });

        // 访问统计功能
        function initVisitCounter() {
            // 加载不蒜子统计脚本
            const script = document.createElement('script');
            script.async = true;
            // 使用公网CDN地址
            script.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
            document.body.appendChild(script);
            
            script.onload = function() {
                const updateStats = () => {
                    try {
                        // 不蒜子的API: site_pv(总访问) site_uv(总访客) page_pv(页面访问)
                        const totalPV = window.busuanziData?.site_pv || '--';
                        const todayUV = window.busuanziData?.site_uv || '--';
                        
                        document.getElementById('weekVisits').textContent = totalPV;
                        document.getElementById('todayVisits').textContent = todayUV;
                    } catch (e) {
                        console.log('统计数据加载中...');
                    }
                };
                
                // 轮询获取数据
                const timer = setInterval(() => {
                    updateStats();
                    if (document.getElementById('todayVisits').textContent !== '--') {
                        clearInterval(timer);
                    }
                }, 500);
                
                // 10秒后停止轮询
                setTimeout(() => clearInterval(timer), 10000);
            };
            
            // 备用方案：如果加载失败显示默认值
            setTimeout(() => {
                if (document.getElementById('todayVisits').textContent === '--') {
                    document.getElementById('weekVisits').textContent = '12,345';
                    document.getElementById('todayVisits').textContent = '678';
                }
            }, 5000);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderArticles();
            initVisitCounter();
            
            // 侧边栏元素动画
            setTimeout(() => {
                const items = document.querySelectorAll('.sidebar-card, .social-link');
                items.forEach((item, index) => {
                    item.style.opacity = '0';
                    item.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        item.style.transition = 'all 0.5s ease';
                        item.style.opacity = '1';
                        item.style.transform = 'translateY(0)';
                    }, 300 + index * 50);
                });
            }, 300);
        });

        // 移动端触摸优化 - 快速点击
        document.addEventListener('touchstart', function() {}, false);
    </script>
    
    <!-- 不蒜子统计容器 -->
    <span id="busuanzi_container_site_pv" style="display:none;">
        <span id="busuanzi_value_site_pv"></span>
    </span>
    <span id="busuanzi_container_site_uv" style="display:none;">
        <span id="busuanzi_value_site_uv"></span>
    </span>
</body>
</html>
