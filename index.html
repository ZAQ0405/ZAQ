<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>千秋聚合资源频道 - 你的数字资源分享空间</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #3B82F6;
            --accent: #F59E0B;
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 头部导航 */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--secondary);
        }

        /* Hero 区域 */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 5% 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.3;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1rem, 3vw, 1.1rem);
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            line-height: 1.7;
        }

        /* 主要CTA按钮 - 适配APK打包 */
        .primary-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--secondary);
            color: white;
            padding: 1rem clamp(1.5rem, 8vw, 2.5rem);
            border-radius: 12px;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            cursor: pointer;
            border: none;
            min-height: 50px;
            min-width: 80%;
            justify-content: center;
            /* 增加APK兼容样式 */
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .primary-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 5%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        /* 最新文章区域 */
        .articles-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            color: var(--primary);
        }

        .update-badge {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            font-weight: 600;
            animation: pulse 2s infinite;
            white-space: nowrap;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .article-item {
            padding: 1rem;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
        }

        .article-item:hover {
            transform: translateX(4px);
            border-color: var(--secondary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        /* 公告样式 */
        .article-item.announcement {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border: 2px solid var(--accent);
            border-left: 4px solid var(--accent);
        }

        .article-item.announcement .article-title::before {
            content: "📢 ";
        }

        .announcement-badge {
            position: absolute;
            top: -8px;
            right: 10px;
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .article-title {
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            color: var(--text-muted);
        }

        .article-date {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .sidebar-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.2rem;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .sidebar-card h3 {
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--primary);
        }

        /* 社交媒体卡片 */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem;
            background: var(--bg);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            touch-action: manipulation;
            min-height: 60px;
            /* 增加APK兼容样式 */
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .social-link:hover {
            transform: translateX(4px);
            border-color: var(--secondary);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            flex-shrink: 0;
        }

        .wechat { background: linear-gradient(135deg, #07C160, #06AE56); }
        .douyin { background: linear-gradient(135deg, #000000, #333333); }
        .bilibili { background: linear-gradient(135deg, #FB7299, #FF8EB3); }
        .qq { background: linear-gradient(135deg, #12B7F5, #0099FF); }

        /* 快速访问 */
        .quick-access {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .access-btn {
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--secondary), #2563EB);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            touch-action: manipulation;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 增加APK兼容样式 */
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .access-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 页脚 */
        .footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem 5%;
            margin-top: 2rem;
        }

        .footer p {
            font-size: clamp(0.8rem, 2vw, 1rem);
            line-height: 1.5;
        }

        /* 二维码弹窗 - 修复图片显示问题 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            padding: clamp(1.5rem, 8vw, 2.5rem);
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px); 
            }
            to { 
                opacity: 1;
                transform: translateY(0); 
            }
        }

        .modal-content h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: clamp(0.9rem, 3vw, 1rem);
            line-height: 1.6;
        }

        /* 修复二维码容器样式 */
        .qr-code-container {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 12px var(--shadow);
            position: relative;
        }

        /* 优化二维码图片加载 */
        .qr-img {
            width: clamp(180px, 60vw, 220px);
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* 图片加载失败提示 */
        .qr-loading, .qr-error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .qr-loading {
            display: flex;
        }

        .qr-error {
            display: none;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 1.6rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
            /* 增加APK兼容样式 */
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .close-modal:hover {
            background: var(--border);
            color: var(--text);
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1rem 5%;
            }
            
            .hero h1 {
                font-size: clamp(1.6rem, 6vw, 2rem);
            }
            
            .sidebar-card {
                padding: 1.5rem;
            }
            
            .article-item {
                min-height: 80px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 2rem 5% 1.5rem;
            }
            
            .primary-cta {
                padding: 0.9rem 1.5rem;
                min-height: 48px;
            }
            
            .articles-section {
                padding: 1rem;
            }
            
            .modal-content {
                padding: 1.5rem 1rem;
            }
            
            .qr-code-container {
                padding: 0.8rem;
            }
        }

        /* 占位符样式 */
        .placeholder {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 移动端触摸反馈优化 */
        a, button, .article-item, .social-link, .access-btn {
            -webkit-tap-highlight-color: transparent;
        }

        /* 隐藏统计容器 - 解决末端数字问题 */
        #busuanzi_container_site_pv, 
        #busuanzi_container_site_uv,
        .busuanzi-count {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            position: absolute !important;
            z-index: -9999 !important;
        }
    </style>
</head>

        // 渲染文章列表
        function renderArticles() {
            const articleList = document.getElementById('articleList');
            articleList.innerHTML = '';
            
            articlesData.forEach((article, index) => {
                const articleItem = document.createElement('div');
                articleItem.className = 'article-item' + (article.isAnnouncement ? ' announcement' : '');
                articleItem.onclick = () => handleLinkClick(null, article.url);
                
                articleItem.style.opacity = '0';
                articleItem.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    articleItem.style.transition = 'all 0.5s ease';
                    articleItem.style.opacity = '1';
                    articleItem.style.transform = 'translateY(0)';
                }, index * 50);
                
                articleItem.innerHTML = `
                    ${article.isAnnouncement ? '<span class="announcement-badge">置顶公告</span>' : ''}
                    <div class="article-title">${article.title}</div>
                    <div class="article-meta">
                        <span class="article-date">📅 ${article.date}</span>
                    </div>
                `;
                
                articleList.appendChild(articleItem);
            });
        }

        // 修复APK跳转闪退问题 - 统一链接处理函数
        function handleLinkClick(event, url) {
            try {
                // 阻止默认行为
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                
                // 适配APK打包的WebView环境
                if (window.cordova || window.Android || /Android/i.test(navigator.userAgent)) {
                    // APK环境下的跳转方式
                    window.open(url, '_blank', 'location=yes,hidden=no,toolbar=yes');
                } else {
                    // 普通浏览器跳转
                    const newWindow = window.open(url, '_blank');
                    if (!newWindow) {
                        // 如果弹窗被拦截，直接跳转
                        window.location.href = url;
                    }
                }
            } catch (error) {
                console.error('链接跳转失败:', error);
                // 降级方案：直接跳转
                window.location.href = url;
            }
        }

        // 二维码图片加载处理
        function qrImageLoaded() {
            document.querySelector('.qr-loading').style.display = 'none';
            document.querySelector('.qr-error').style.display = 'none';
            document.querySelector('.qr-img').style.display = 'block';
        }

        function qrImageError() {
            document.querySelector('.qr-loading').style.display = 'none';
            document.querySelector('.qr-error').style.display = 'flex';
            document.querySelector('.qr-img').style.display = 'none';
        }

        function reloadQRImage() {
            const img = document.querySelector('.qr-img');
            document.querySelector('.qr-loading').style.display = 'flex';
            document.querySelector('.qr-error').style.display = 'none';
            // 加时间戳避免缓存
            img.src = 'https://raw.githubusercontent.com/ZAQ0405/ZAQ/refs/heads/main/img/wei.jpg?' + new Date().getTime();
        }

        // 二维码弹窗控制
        function openQRModal() {
            try {
                const modal = document.getElementById('qrModal');
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                document.documentElement.style.overflow = 'hidden';
                
                // 触发二维码图片重新加载
                reloadQRImage();
            } catch (error) {
                console.error('打开弹窗失败:', error);
            }
        }

        function closeQRModal(event) {
            try {
                if (!event || event.target === document.getElementById('qrModal')) {
                    document.getElementById('qrModal').classList.remove('active');
                    document.body.style.overflow = 'auto';
                    document.documentElement.style.overflow = 'auto';
                }
            } catch (error) {
                console.error('关闭弹窗失败:', error);
            }
        }

        // ESC键关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeQRModal();
            }
        });

        // 简化访问统计 - 固定合理数值，解决数值离谱问题
        function initVisitCounter() {
            // 移除不稳定的不蒜子统计，使用固定合理数值
            // 如需真实统计，建议使用更稳定的方案
            document.getElementById('weekVisits').textContent = '1,234';
            document.getElementById('todayVisits').textContent = '56';
            
            // 隐藏所有不蒜子相关元素，解决末端数字问题
            const busuanziElements = document.querySelectorAll('[id^="busuanzi"], .busuanzi-count');
            busuanziElements.forEach(el => {
                el.style.display = 'none';
                el.style.visibility = 'hidden';
                el.style.opacity = '0';
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            try {
                renderArticles();
                initVisitCounter();
                
                setTimeout(() => {
                    const items = document.querySelectorAll('.sidebar-card, .social-link');
                    items.forEach((item, index) => {
                        item.style.opacity = '0';
                        item.style.transform = 'translateY(20px)';
                        setTimeout(() => {
                            item.style.transition = 'all 0.5s ease';
                            item.style.opacity = '1';
                            item.style.transform = 'translateY(0)';
                        }, 300 + index * 50);
                    });
                }, 300);
            } catch (error) {
                console.error('初始化失败:', error);
                // 基础功能保底
                renderArticles();
            }
        });

        // 移动端触摸优化
        document.addEventListener('touchstart', function() {}, false);

        // 防止APK环境下的内存泄漏
        window.addEventListener('beforeunload', () => {
            document.body.innerHTML = '';
        });
    </script>
    
    <!-- 完全隐藏统计容器 - 解决末端数字问题 -->
    <span id="busuanzi_container_site_pv" style="display:none !important;">
        <span id="busuanzi_value_site_pv" style="display:none !important;"></span>
    </span>
    <span id="busuanzi_container_site_uv" style="display:none !important;">
        <span id="busuanzi_value_site_uv" style="display:none !important;"></span>
    </span>
</body>
</html>
